services:
  - type: web
    name: inventory-forecast
    runtime: python
    plan: free
    buildCommand: bash ./build.sh
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20"
